<div class="citizen-card" *ngIf="visible">
  <!-- Avatar -->
  <div class="citizen-card__avatar">
    <svg
      xmlns="http://www.w3.org/2000/svg"
      fill="none"
      viewBox="0 0 24 24"
      stroke="currentColor"
      stroke-width="1.5"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"
      />
    </svg>
  </div>

  <!-- Info -->
  <div class="citizen-card__info">
    <div class="citizen-card__name">
      {{ name || '—' }}
    </div>

    <div class="citizen-card__meta">
      <span>CC: {{ cedula || '—' }}</span>
      <span class="citizen-card__dot">·</span>
      <span>Centro actual:</span>
      <span class="citizen-card__center">
        {{ center || '—' }}
      </span>
    </div>
  </div>

  <!-- Status -->
  <div class="citizen-card__status">
    <div class="citizen-card__status-dot"></div>
    <span>Verificado</span>
  </div>
</div>
