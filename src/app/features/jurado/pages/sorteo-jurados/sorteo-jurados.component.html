<section class="page">
  <div class="page__header">
    <h1>Sorteo de Jurados</h1>
    <p>Designe ciudadanos como jurados de votación mediante sorteo aleatorio.</p>
  </div>

  <div class="page__content">
    <!-- Panel izquierdo: formulario -->
    <div class="page__card">
      <app-jurado-form
        [elecciones]="elecciones"
        [mesas]="mesas"
        [empresas]="empresas"
        (formSubmit)="onRegistrarJurado($event)"
      ></app-jurado-form>
    </div>

    <!-- Panel derecho: sorteo aleatorio -->
    <div class="page__sorteo">
      <div class="sorteo__header">
        <h3>Sorteo Automático</h3>
        <p>Seleccione una elección y ejecute el sorteo para asignar jurados aleatoriamente.</p>
      </div>

      <div class="sorteo__select">
        <label>Elección para el sorteo</label>
        <select [(ngModel)]="eleccionSorteoId">
          <option value="">Seleccione una elección</option>
          <option *ngFor="let e of elecciones" [value]="e.id">{{ e.nombre }}</option>
        </select>
      </div>

      <button
        class="sorteo__btn"
        (click)="onEjecutarSorteo()"
        [disabled]="!eleccionSorteoId || sorteando"
      >
        {{ sorteando ? 'Ejecutando sorteo...' : '🎲 Ejecutar Sorteo' }}
      </button>

      <!-- Resultado del sorteo -->
      <div class="sorteo__resultado" *ngIf="resultadoSorteo.length > 0">
        <h4>Jurados asignados</h4>
        <div class="sorteo__item" *ngFor="let j of resultadoSorteo">
          <span class="sorteo__nombre">{{ j.nombres }} {{ j.apellidos }}</span>
          <span class="sorteo__tipo">{{ j.juradoTipo }}</span>
        </div>
      </div>
    </div>
  </div>

  <app-toast
    *ngIf="showToast"
    [message]="toastMessage"
    [type]="toastType"
    (close)="onCloseToast()"
  ></app-toast>
</section>
