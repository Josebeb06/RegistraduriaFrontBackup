<!-- ══ TOPBAR institucional ══ -->
<div class="topbar">
  <div class="topbar__inner">
    <div class="topbar__left">
      <span>🇨🇴</span>
      <span>República de Colombia</span>
      <span class="topbar__sep">·</span>
      Registraduría Nacional del Estado Civil
      <span class="topbar__sep">·</span>
      Portal Oficial de Funcionarios
    </div>
    <div class="topbar__right">
      <a class="topbar__link">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 7V5z"
          />
        </svg>
        Soporte: 01 8000 11 60 34
      </a>
      <a class="topbar__link">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
          />
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"
          />
        </svg>
        Accesibilidad
      </a>
    </div>
  </div>
</div>

<!-- ══ HEADER principal ══ -->
<header class="header">
  <div class="header__inner">
    <!-- Logo -->
    <a routerLink="/" class="logo">
      <div class="logo__shield">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"
          />
        </svg>
      </div>
      <div class="logo__text">
        <span class="logo__name">Vote<em>4</em>Tech</span>
        <span class="logo__sub">Sistema Electoral Nacional</span>
      </div>
    </a>

    <!-- Nav desktop -->
    <nav class="nav" [class.nav--open]="menuOpen">
      <a
        routerLink="/"
        routerLinkActive="nav__link--active"
        [routerLinkActiveOptions]="{ exact: true }"
        class="nav__link"
        (click)="closeMenu()"
        >Inicio</a
      >
      <a
        routerLink="/candidato/crear"
        routerLinkActive="nav__link--active"
        class="nav__link"
        (click)="closeMenu()"
        >Candidatos</a
      >
      <a
        routerLink="/eleccion/crear"
        routerLinkActive="nav__link--active"
        class="nav__link"
        (click)="closeMenu()"
        >Elecciones</a
      >
      <a
        routerLink="/jurado/sorteo"
        routerLinkActive="nav__link--active"
        class="nav__link"
        (click)="closeMenu()"
        >Jurados</a
      >
      <div class="nav__divider"></div>
      <a
        routerLink="/jurado/capacitacion"
        routerLinkActive="nav__link--active"
        class="nav__link"
        (click)="closeMenu()"
        >Capacitación</a
      >
    </nav>

    <!-- Actions -->
    <div class="header__actions">
      <button class="btn-icon" title="Ayuda">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
          />
        </svg>
        Ayuda
      </button>

      <a routerLink="/" class="btn-access">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"
          />
        </svg>
        Panel
      </a>

      <!-- Hamburger mobile -->
      <button
        class="hamburger"
        (click)="toggleMenu()"
        [class.hamburger--open]="menuOpen"
        aria-label="Menú"
      >
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </div>
</header>
