<header class="header">
  <div class="header__container">
    
    <!-- LOGO/MARCA -->
    <div class="header__logo">
      <a routerLink="/">
        <h2>Vote4Tech</h2>
      </a>
    </div>

    <!-- NAVEGACIÓN -->
    <nav class="header__nav">
      <ul class="header__menu">
        <li *ngIf="isAuthenticated">
          <a routerLink="/candidato" routerLinkActive="active">Candidatos</a>
        </li>
        <li *ngIf="isAuthenticated">
          <a routerLink="/eleccion" routerLinkActive="active">Elecciones</a>
        </li>
        <li *ngIf="isAuthenticated">
          <a routerLink="/jurado" routerLinkActive="active">Jurados</a>
        </li>
      </ul>
    </nav>

    <!-- USUARIO Y LOGOUT -->
    <div class="header__auth">
      <div *ngIf="isAuthenticated" class="header__user-info">
        <span class="header__user-type">{{ getTypeLabel() }}</span>
        <span class="header__user-name">{{ userName }}</span>
        <button class="header__logout-btn" (click)="onLogout()">
          Cerrar Sesión
        </button>
      </div>

      <div *ngIf="!isAuthenticated" class="header__login">
        <a routerLink="/login" class="header__login-link">Iniciar Sesión</a>
      </div>
    </div>

  </div>
</header>
